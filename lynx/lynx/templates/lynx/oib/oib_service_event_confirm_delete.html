{% extends 'lynx/base.html' %}

{% block title %}Confirm deleting note{% endblock %}

{% block content %}
  <h2>Delete Service Event</h2>
  <p>Are you sure you want to delete this service event?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'lynx:oib_service_event_show' service_event.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
